name: Feature proposal
description: 新しい機能や運用改善を提案する
title: "[Feature]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期待する結果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: textarea
    id: compatibility
    attributes:
      label: 既存利用者や互換性への影響
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: Secret、個人情報、会社の非公開情報を含めていません
          required: true
