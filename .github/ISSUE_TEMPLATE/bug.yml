name: Bug report
description: 再現可能な不具合を報告する
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Security、credential、個人情報、会社の非公開情報はpublic Issueへ書かず、SECURITY.mdに従ってください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました
          required: true
        - label: 公開できない情報を含めていません
          required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      placeholder: "例: 0.10.0"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Project Model
      options: [development, task-workspace, not-applicable, unknown]
    validations:
      required: true
  - type: dropdown
    id: ai-surface
    attributes:
      label: AI surface
      options: [codex, claude, both, rovo, not-applicable]
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小の再現手順
      placeholder: Secretを除いたcommandと前提を記載してください
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足情報
      description: OS、Node.js、profile、公開可能なerror等
